name: Benchmarks

# Benchmark projects compile as part of the solution build, so CI already catches a benchmark
# that stops compiling. What it never caught is a benchmark that stops *running* -- a broken
# [GlobalSetup], a filter that matches nothing, a class no entry point reaches. This workflow
# covers that gap.
#
#   smoke (automatic)  one operation per benchmark, no statistics. Proves every benchmark still
#                      executes. Takes about a minute; the numbers it prints are meaningless.
#   full  (manual)     real measurements, via "Run workflow". Uploads BenchmarkDotNet.Artifacts.
#
# The smoke job runs the org's shared gate. BenchmarkDotNet exits 0 when a filter matches nothing
# and counts a crashed benchmark as executed, so the gate checks that every benchmark reported a
# result instead. See ZeroAlloc-Net/.github .github/workflows/benchmark-smoke.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: 'Benchmark filter, matched against namespace.type.method'
        default: '*'
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  smoke:
    name: smoke / ${{ matrix.project }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/ZeroAlloc.Mediator.Benchmarks
          - tests/ZeroAlloc.Mediator.Benchmarks.Dispatch
    uses: ZeroAlloc-Net/.github/.github/workflows/benchmark-smoke.yml@main
    with:
      project: ${{ matrix.project }}

  full:
    name: full / ${{ matrix.project }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/ZeroAlloc.Mediator.Benchmarks
          - tests/ZeroAlloc.Mediator.Benchmarks.Dispatch
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release

      - name: Run benchmarks
        run: |
          dotnet run --project ${{ matrix.project }} -c Release --no-build -- \
            --filter '${{ inputs.filter }}'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks-${{ strategy.job-index }}
          path: '**/BenchmarkDotNet.Artifacts/**'
          if-no-files-found: warn
