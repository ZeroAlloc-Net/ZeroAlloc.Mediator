name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time. Two quick pushes to main would otherwise run release-please and
# ship-release-tracking concurrently against the same release PR branch. Queued, not
# cancelled: a cancelled run could drop a release or its publish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # Read by ship-release-tracking. A step output is only visible to another job
      # when the job re-exports it here; without these the job's `if:` is always false.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. Single-package mode (release-type passed inline) ignores
          # those files and tracks state via PR labels — which got into a corrupted state
          # producing wrong version PRs (2.0.1 against feat! commits). See #65.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Marks the analyzer rules and public API that the pending release adds as shipped,
  # by committing the move onto the release PR branch. Merging that PR then lands the
  # move in the same commit that tags the release, so AnalyzerReleases.Shipped.md and
  # PublicAPI.Shipped.txt always say what each published version contains. Without it
  # nothing was ever marked shipped, so the analyzers could not flag a change to a
  # shipped rule or a shipped API. Shared from ZeroAlloc-Net/.github; see
  # ZeroAlloc-Net/.github#38. release-please rebuilds its branch from main whenever
  # main moves, dropping this commit; the job then runs again in the same workflow run
  # and re-applies it. It commits nothing when nothing is unshipped.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    uses: ZeroAlloc-Net/.github/.github/workflows/ship-release-tracking.yml@main
    with:
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    secrets:
      # Same token as release-please, so this push triggers the PR's checks exactly
      # as release-please's own push does. Empty falls back to GITHUB_TOKEN.
      RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          # Discovered, not listed. A hardcoded list silently omits any newly
          # added package: the release still goes green and the package simply
          # never appears on NuGet. Defaulting to pack means a new src project
          # ships unless it opts out, so the failure mode is a surplus package
          # someone notices rather than a missing one nobody does.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (IsPackable=false)"
              continue
            fi
            echo "Packing $csproj"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion=${{ needs.release-please.outputs.version }} -o ./nupkg
          done
          if ! ls ./nupkg/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

      # Moved here from the removed release.yml, which was the only place it ran. Checks the
      # generator lands under analyzers/dotnet/cs rather than lib/, since a regression there
      # silently stops the source generator running for every consumer.
      - name: Verify generator pack layout
        run: bash scripts/verify-generator-pack-layout.sh ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
